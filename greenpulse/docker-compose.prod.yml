name: greenpulse-prod

services:
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      target: production
    container_name: greenpulse-frontend-prod
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - greenpulse-network
    restart: always

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: production
    container_name: greenpulse-backend-prod
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY:-7d}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY:-30d}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      - ANTHROPIC_MAX_TOKENS=${ANTHROPIC_MAX_TOKENS:-4096}
      - FRONTEND_URL=${FRONTEND_URL:-http://162.19.115.3}
      - REPORT_STORAGE_PATH=${REPORT_STORAGE_PATH:-/tmp/reports}
      - MAX_CONCURRENT_SCANS=${MAX_CONCURRENT_SCANS:-3}
      - SCAN_TIMEOUT_MS=${SCAN_TIMEOUT_MS:-120000}
      - LIGHTHOUSE_CHROME_FLAGS=${LIGHTHOUSE_CHROME_FLAGS:---no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage}
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - greenpulse-network
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: greenpulse-postgres-prod
    environment:
      - POSTGRES_DB=greenpulse
      - POSTGRES_USER=greenpulse
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-GreenPulse2024!}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U greenpulse']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - greenpulse-network
    restart: always

  redis:
    image: redis:7-alpine
    container_name: greenpulse-redis-prod
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - greenpulse-network
    restart: always

volumes:
  postgres-data:
  redis-data:

networks:
  greenpulse-network:
    driver: bridge
